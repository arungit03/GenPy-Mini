# GenPy-Mini license policy (Phase 2).
#
# Loaded and validated by src/genpy/data/licenses.py::load_license_policy().
#
# This file is a conservative STARTING POINT for human review. It is not
# legal advice, and it does not make any repository automatically safe to
# train on. Before a source is approved, a human reviewer must still check:
#
#   - the actual upstream license text (not just the SPDX label)
#   - dataset-level terms of use, separate from the code license
#   - repository-specific exceptions, dual-licensing, or CLA terms
#   - attribution and notice requirements
#   - redistribution restrictions on the code or derived artifacts
#   - whether the repository bundles generated or vendored third-party code
#     under a *different* license than the one declared here
#
# Public visibility of a repository is never treated as a license grant.

schema_version: 1

disclaimer: >
  This policy is an initial, conservative classification of common SPDX
  license identifiers. It is provided for triage only and is not legal
  advice. A human reviewer must independently verify the points listed
  above for every source before it is approved for acquisition, and must
  re-verify them if the source's license ever changes.

# Fallback status for any SPDX identifier not listed below. "review_required"
# means a human must classify it (into allowed/review_required/blocked)
# before a source using it can be approved.
default_status: review_required

# Broadly permissive licenses commonly compatible with training use.
# "Allowed" means the license *family* is compatible in common cases, not
# that every repository under it has been individually cleared -- governance
# review (config/dataset_sources.yaml -> governance.approval_status) is
# still required per source.
allowed:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - Python-2.0
  - Python-2.0.1
  - Unlicense
  - 0BSD
  - CC0-1.0
  - Zlib

# Licenses with conditions (copyleft scope, attribution/share-alike terms,
# patent clauses, etc.) that need a human decision before use.
review_required:
  - MPL-2.0
  - LGPL-2.1-only
  - LGPL-2.1-or-later
  - LGPL-3.0-only
  - LGPL-3.0-or-later
  - EPL-1.0
  - EPL-2.0
  - CC-BY-4.0
  - CC-BY-SA-4.0
  - Artistic-2.0

# Licenses (or license-like restrictions) that are not permitted for
# acquisition under this policy. Sources evaluating to "blocked" can never
# be acquired, with or without a CLI override.
blocked:
  - GPL-2.0-only
  - GPL-2.0-or-later
  - GPL-3.0-only
  - GPL-3.0-or-later
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  - SSPL-1.0
  - CC-BY-NC-4.0
  - CC-BY-NC-SA-4.0
  - CC-BY-ND-4.0
  - proprietary
