tokenizer:
  name: GenPy-Tokenizer
  algorithm: byte_level_bpe

  vocab_size: 32000
  min_frequency: 2
  max_token_length: 64

  normalizer: nfc

  byte_level:
    add_prefix_space: false
    use_regex: true

  special_tokens:
    pad_token: "<|pad|>"
    bos_token: "<|bos|>"
    eos_token: "<|eos|>"
    unk_token: "<|unk|>"

training_data:
  input_dir: data/processed
  train_pattern: "train-*.jsonl.gz"
  validation_pattern: "validation-*.jsonl.gz"
  text_field: text

output:
  output_dir: data/tokenizer
  tokenizer_file: genpy-tokenizer.json
  config_file: tokenizer_config.json
  manifest_file: tokenizer_manifest.json
  evaluation_file: tokenizer_evaluation.json

training:
  show_progress: true
  production_target_bytes: 1073741824
  production_minimum_bytes: 268435456
