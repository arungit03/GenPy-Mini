model:
  name: GenPy-200M
  vocab_size: 32000
  max_seq_len: 1024
  hidden_size: 768
  num_layers: 24
  num_heads: 12
  head_dim: 64
  intermediate_size: 2176
  norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_embeddings: true
  attention_dropout: 0.0
  residual_dropout: 0.0
  embedding_dropout: 0.0
  bias: false
  initializer_range: 0.02
