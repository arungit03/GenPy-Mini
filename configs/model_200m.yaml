model:
  name: GenPy-200M
  vocab_size: 32000
  max_seq_len: 1024
  n_layers: 24
  d_model: 768
  n_heads: 12
  head_dim: 64
  ffn_hidden_size: 2176
  norm_type: rmsnorm
  norm_eps: 1.0e-5
  positional_encoding: rope
  rope_theta: 10000.0
  activation: swiglu
  attention_bias: false
  mlp_bias: false
  tie_word_embeddings: true
  embedding_dropout: 0.0
  attention_dropout: 0.0
  residual_dropout: 0.0

training:
  seed: 42

tokenizer:
  vocab_size: 32000
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2
  unk_token_id: 3
