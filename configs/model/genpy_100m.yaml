model:
  name: GenPy-100M
  architecture: decoder_only_transformer
  vocab_size: 16384
  context_length: 1024
  num_layers: 12
  hidden_size: 768
  num_attention_heads: 12
  head_dimension: 64
  intermediate_size: 2048
  activation: swiglu
  normalization: rmsnorm
  positional_encoding: rope
  tie_word_embeddings: true
  attention_dropout: 0.0
  residual_dropout: 0.1
  initialization: random
  attention: causal_self_attention
  parameter_count_note: expected to be approximately 98-100M; verify programmatically later
tokenizer:
  type: byte_level_bpe
  vocab_size: 16384
  trained: false
  special_tokens:
    pad: "<|pad|>"
    bos: "<|bos|>"
    eos: "<|eos|>"
    user: "<|user|>"
    assistant: "<|assistant|>"
    code: "<|code|>"
    end: "<|end|>"
  special_token_ids:
    pad: 0
    bos: 1
    eos: 2
    user: 3
    assistant: 4
    code: 5
    end: 6
training:
  seed: 1337
  phase: placeholder
