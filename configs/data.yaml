dataset:
  name: GenPy Python Dataset
  language: python
  target_examples: 100000
  train_ratio: 0.90
  validation_ratio: 0.05
  test_ratio: 0.05
  seed: 42
  minimum_instruction_chars: 5
  minimum_response_chars: 5
  strict_python_syntax: true
  deduplication:
    exact: true
    instruction: true
    code: true
    near_duplicate: true
    near_duplicate_threshold: 0.90
  quality:
    minimum_score: 0.5
