policy_version: 1
legal_notice: This project policy is not legal advice or a guarantee of legal safety.
allowlist:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - 0BSD
  - CC0-1.0
  - Unlicense
review_required:
  - custom
  - unknown
deny_families:
  - GPL
  - AGPL
  - LGPL
  - MPL
  - non-commercial
  - research-only
require_provenance: true
require_repository_or_record_licence: true
reject_dataset_file_conflicts: true
