      detector; manual inspection confirms the terms section is textbook 3-clause BSD
      (retain-notice, reproduce-in-binary, no-endorsement, standard disclaimer). Treated as
      manually-verified BSD-3-Clause, consistent with PyTorch's well-documented licence.
      Nested-licence scan found 13 separately-licensed subtrees; torch/_vendor/* (packaging,
      quack) is already caught by the global "_vendor" path filter. Explicitly excluded via
      exclude_globs: test/cpython/v3_13/ (76 files, a vendored copy of CPython's own test
      suite under the PSF licence, which is outside the allowlist); torch/fx/experimental/
      unification/ (14 files, BSD-3-Clause but a different copyright holder, Matthew
      Rocklin); aten/.../qnnpack/ (3 files, separate BSD licence for the QNNPACK library);
      .ci/manywheel/ (4 files, MIT licence for the manylinux project). Critically,
      functorch/examples/lennard_jones/lennard_jones.py is excluded because its own header
      states it is "adapted from https://github.com/muhrin/milad" and "licensed under the
      GLPv3 license" - GPL is in the policy's deny_families, so this is a real, load-bearing
      exclusion, not a precaution. The six other "mpl"/"gpl" regex hits in functorch/examples
      were manually confirmed as matplotlib-alias false positives (`import matplotlib as
      mpl`), distinct from the genuine GPL hit.

