schema_version: 1
tokenizer:
  name: genpy-byte-bpe-smoke-1k
  version: 1
  status: smoke
  algorithm: byte_level_bpe
  vocab_size: 1024
  expected_vocab_size: 1024
  min_frequency: 2
  add_prefix_space: false
  use_regex: true
  unicode_normalization: none
  lowercase: false
  dropout: 0.0
  training_seed: 42
  include_special_tokens_in_vocab_size: true
  context_length: 1024
  artifact_path: artifacts/tokenizer/smoke

special_tokens:
  pad: {token: "<|pad|>", id: 0}
  bos: {token: "<|bos|>", id: 1}
  eos: {token: "<|eos|>", id: 2}
  user: {token: "<|user|>", id: 3}
  assistant: {token: "<|assistant|>", id: 4}
  code: {token: "<|code|>", id: 5}
  end: {token: "<|end|>", id: 6}

corpus:
  phase2_config: configs/data/phase2.yaml
  phase2_report: data/reports/dataset_report.json
  pretraining_train: data/splits/pretraining/train
  instruction_train: data/splits/instruction/train
  manifest_path: data/tokenizer/manifests/smoke_corpus.jsonl
  summary_path: data/tokenizer/manifests/smoke_corpus_summary.json
  maximum_bytes: 8388608
  minimum_candidate_bytes: 104857600
  minimum_production_bytes: 524288000
  minimum_smoke_records: 1
  require_validation_and_test: false
  mixture:
    pretraining_weight: 0.85
    instruction_weight: 0.15

readiness:
  required_status: READY_FOR_SMOKE_TOKENIZER

runtime:
  cpu_only: true
  workers: 1
  parallelism: false
