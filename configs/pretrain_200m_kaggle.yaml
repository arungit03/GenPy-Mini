training:
  seed: 42
  device: cuda
  precision: bf16
  sequence_length: 1024
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  max_steps: 1980
  max_tokens: null
  pin_memory: true
optimizer:
  name: adamw
  learning_rate: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
scheduler:
  type: cosine
  warmup_steps: 100
  minimum_learning_rate: 3.0e-5
gradients:
  max_norm: 1.0
validation:
  interval_steps: 100
  batches: 20
logging:
  interval_steps: 10
checkpoint:
  interval_steps: 100
  keep_last: 2
  save_optimizer: true
  save_scheduler: true
  save_rng: true
