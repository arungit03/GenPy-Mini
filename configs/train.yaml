training:
  seed: 42

  micro_batch_size: 4
  gradient_accumulation_steps: 16

  learning_rate: 0.0003
  min_learning_rate: 0.00003
  weight_decay: 0.1

  warmup_ratio: 0.02
  grad_clip: 1.0

  precision: auto

  log_interval: 10
  eval_interval: 500
  save_interval: 1000

  checkpoint_dir: checkpoints
  log_dir: logs

  sequence_length: 1024
  beta1: 0.9
  beta2: 0.95
  adam_eps: 1.0e-8
  num_workers: 0
  pin_memory: true
  eval_batches: 20
  keep_last_checkpoints: 3
