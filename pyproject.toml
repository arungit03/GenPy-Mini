[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genpy"
version = "0.1.0"
description = "Educational decoder-only language model project"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["genpy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
