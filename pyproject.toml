[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genpy"
version = "0.1.0"
description = "A from-scratch Python code-generation language model project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License pending" }
authors = [{ name = "GenPy contributors" }]
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0.1",
  "tokenizers>=0.19",
  "torch>=2.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
data = ["zstandard>=0.23,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["genpy"]
strict = true
warn_unused_ignores = true
warn_return_any = true
exclude = ["tests/fixtures"]
