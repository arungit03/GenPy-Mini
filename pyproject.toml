[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genpy"
version = "0.1.0"
description = "From-scratch Python-specialized decoder-only Transformer language model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "PyYAML",
    "numpy",
    "tokenizers",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["genpy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "gpu: requires CUDA hardware",
    "slow: longer verification test",
    "integration: checkpoint integration verification",
]
